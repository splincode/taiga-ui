name: Prettier debug
on:
  push:
    branches: [tmp/prettier-15061-debug]

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier projects/demo-playwright/tests/experimental/scroll-wheel/scroll-wheel.pw.spec.ts --write
      - run: git diff -- projects/demo-playwright/tests/experimental/scroll-wheel/scroll-wheel.pw.spec.ts
